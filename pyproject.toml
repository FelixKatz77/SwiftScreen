[project]
name = "swiftscreen"
version = "0.1.0"
description = "Design reaction screening plates and generate Opentrons protocols"
readme = "README.md"
authors = [{ name = "Felix Katzenburg" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "rdkit>=2024.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swiftscreen"]
